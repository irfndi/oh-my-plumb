name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Package test scripts invoke vp (curl-installed, not a devDependency).
      - run: curl -fsSL https://vite.plus | bash
      - run: echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"
      - run: vp fmt --check .
      # Ordered: vp run -r parallelizes and cli compiles before schema dist exists.
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
