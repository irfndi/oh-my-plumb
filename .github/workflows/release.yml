name: release

on:
  push:
    tags:
      - "oh-my-plumb-schema-v*"
      - "oh-my-plumb-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing (OIDC): no NPM_TOKEN secret. Both packages must be
      # registered on npmjs.com as trusted publishers for this repo + workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: curl -fsSL https://vite.plus | bash
      - run: echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"
      - run: vp fmt --check .
      # Ordered: vp run -r parallelizes and cli compiles before schema dist exists.
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      # Publish by filter: `--filter oh-my-plumb` also matches the private root
      # package, so name the schema explicitly and filter cli by directory.
      # One tag publishes only its own package; bump both in lockstep otherwise.
      - name: Publish schema
        if: startsWith(github.ref, 'refs/tags/oh-my-plumb-schema-v')
        working-directory: packages/schema
        run: npm publish --access public --provenance
      # Same shape as schema: pnpm's publish delegation breaks OIDC (ENEEDAUTH).
      # npm publish rejects the workspace: protocol, so the schema dep is pinned
      # to the released version first.
      - name: Pin schema version for publish
        if: startsWith(github.ref, 'refs/tags/oh-my-plumb-v')
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('packages/cli/package.json','utf8'));const v=require('./packages/schema/package.json').version;p.dependencies['oh-my-plumb-schema']='^'+v;fs.writeFileSync('packages/cli/package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Publish cli
        if: startsWith(github.ref, 'refs/tags/oh-my-plumb-v')
        working-directory: packages/cli
        run: npm publish --access public --provenance
