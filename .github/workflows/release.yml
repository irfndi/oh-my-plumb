name: release

on:
  push:
    tags:
      - "oh-my-plumb-schema-v*"
      - "oh-my-plumb-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: curl -fsSL https://vite.plus | bash
      - run: echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"
      - run: vp fmt --check .
      # Ordered: vp run -r parallelizes and cli compiles before schema dist exists.
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      # Publish by path: `--filter oh-my-plumb` matches the root package too (private).
      # One tag publishes only its own package; bump both in lockstep otherwise.
      - name: Publish schema
        if: startsWith(github.ref, 'refs/tags/oh-my-plumb-schema-v')
        run: pnpm -C packages/schema publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish cli
        if: startsWith(github.ref, 'refs/tags/oh-my-plumb-v')
        run: pnpm -C packages/cli publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
