name: release

on:
  push:
    tags:
      - "oh-my-plumb-schema-v*"
      - "oh-my-plumb-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing (OIDC): no NPM_TOKEN secret. Both packages must be
      # registered on npmjs.com as trusted publishers for this repo + workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: curl -fsSL https://vite.plus | bash
      - run: echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"
      - run: vp fmt --check .
      # Ordered: vp run -r parallelizes and cli compiles before schema dist exists.
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      # Publish by filter: `--filter oh-my-plumb` also matches the private root
      # package, so name the schema explicitly and filter cli by directory.
      # One tag publishes only its own package; bump both in lockstep otherwise.
      - name: Publish schema
        if: startsWith(github.ref, 'refs/tags/oh-my-plumb-schema-v')
        run: pnpm --filter oh-my-plumb-schema publish --access public --provenance
      - name: Publish cli
        if: startsWith(github.ref, 'refs/tags/oh-my-plumb-v')
        run: pnpm --filter ./packages/cli publish --access public --provenance
